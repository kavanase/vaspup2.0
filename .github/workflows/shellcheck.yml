name: ShellCheck

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          # checkforce is a Perl script, not shell
          ignore_names: checkforce
        env:
          SHELLCHECK_OPTS: --shell=bash
